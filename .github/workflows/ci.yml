name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Setup Supabase CLI
      uses: supabase/setup-cli@v1
      with:
        version: '1.162.4'

    - name: Start Supabase
      run: |
        npx supabase start
        npx supabase db reset
        npx supabase status -o env >> $GITHUB_ENV

    - name: Setup Deno
      uses: denoland/setup-deno@v1
      with:
        deno-version: v2.x

    - name: Run Deno tests
      run: deno test --allow-env --allow-net supabase/functions/

    - name: Run lint
      run: npm run lint

    - name: Run unit tests
      run: npx vitest run

    - name: Build project
      run: npm run build

    - name: Typecheck
      run: npx tsc --noEmit

    - name: Install Playwright browsers
      run: npx playwright install chromium

    - name: Run E2E tests
      run: npx playwright test

    - name: Secret Scan
      run: |
        if grep -rq "service_role" dist/; then
          echo "Error: service_role token found in client bundle!"
          exit 1
        fi
        if grep -rq "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Ij" dist/; then
          echo "Error: hardcoded JWT found in client bundle!"
          exit 1
        fi
        echo "Secret scan passed."
