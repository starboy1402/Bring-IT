<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet" />
</head>
<body style="margin:0; overflow:hidden; background:#0f172a;">
  <div
    id="root"
    data-composition-id="main"
    data-start="0"
    data-duration="20"
    data-fps="30"
    data-width="1920"
    data-height="1080"
  >
    <!-- Scene 1: Hook — 0-3s -->
    <div
      id="hook"
      class="clip"
      data-composition-id="hook"
      data-composition-src="compositions/hook.html"
      data-start="0"
      data-duration="3"
      data-track-index="1"
      data-track-kind="graphics"
      data-width="1920"
      data-height="1080"
      style="z-index:1;"
    ></div>

    <!-- Scene 2: Feed — 3-8s -->
    <div
      id="feed"
      class="clip"
      data-composition-id="feed"
      data-composition-src="compositions/feed.html"
      data-start="3"
      data-duration="5"
      data-track-index="2"
      data-track-kind="graphics"
      data-width="1920"
      data-height="1080"
      style="z-index:2;"
    ></div>

    <!-- Scene 3: Create — 8-13s -->
    <div
      id="create"
      class="clip"
      data-composition-id="create"
      data-composition-src="compositions/create.html"
      data-start="8"
      data-duration="5"
      data-track-index="3"
      data-track-kind="graphics"
      data-width="1920"
      data-height="1080"
      style="z-index:3;"
    ></div>

    <!-- Scene 4: Chat — 13-17s -->
    <div
      id="chat"
      class="clip"
      data-composition-id="chat"
      data-composition-src="compositions/chat.html"
      data-start="13"
      data-duration="4"
      data-track-index="4"
      data-track-kind="graphics"
      data-width="1920"
      data-height="1080"
      style="z-index:4;"
    ></div>

    <!-- Scene 5: Outro — 17-20s -->
    <div
      id="outro"
      class="clip"
      data-composition-id="outro"
      data-composition-src="compositions/outro.html"
      data-start="17"
      data-duration="3"
      data-track-index="5"
      data-track-kind="graphics"
      data-width="1920"
      data-height="1080"
      style="z-index:5;"
    ></div>

    <!-- Music bed -->
    <audio
      id="bg-music"
      class="clip"
      data-start="0"
      data-duration="20"
      data-track-index="10"
      data-volume="0.35"
      data-fade-out="2"
      src="assets/music/happy-beats-business-moves-vol-1-by-ende-dot-app.mp3"
    ></audio>

    <!-- SFX: Hook impact -->
    <audio id="sfx-hook" class="clip" data-start="0.3" data-duration="1" data-track-index="11" data-volume="0.70" src="assets/sfx/impact/impactSoft_medium_000.ogg"></audio>

    <!-- SFX: Card slides (Scene 2) -->
    <audio id="sfx-card1" class="clip" data-start="3.52" data-duration="1" data-track-index="12" data-volume="0.65" src="assets/sfx/casino/card-slide-1.ogg"></audio>
    <audio id="sfx-card2" class="clip" data-start="4.53" data-duration="1" data-track-index="13" data-volume="0.65" src="assets/sfx/casino/card-slide-2.ogg"></audio>
    <audio id="sfx-card3" class="clip" data-start="5.53" data-duration="1" data-track-index="14" data-volume="0.65" src="assets/sfx/casino/card-slide-3.ogg"></audio>

    <!-- SFX: Clicks (Scene 3) -->
    <audio id="sfx-click1" class="clip" data-start="9.02" data-duration="0.5" data-track-index="15" data-volume="0.60" src="assets/sfx/interface/click_003.ogg"></audio>
    <audio id="sfx-click2" class="clip" data-start="10.02" data-duration="0.5" data-track-index="16" data-volume="0.60" src="assets/sfx/interface/click_003.ogg"></audio>

    <!-- SFX: Chat message drops (Scene 4) -->
    <audio id="sfx-msg1" class="clip" data-start="13.5" data-duration="0.8" data-track-index="17" data-volume="0.55" src="assets/sfx/interface/drop_001.ogg"></audio>
    <audio id="sfx-msg2" class="clip" data-start="14.8" data-duration="0.8" data-track-index="18" data-volume="0.55" src="assets/sfx/interface/drop_001.ogg"></audio>

    <!-- SFX: Logo bell (Scene 5) -->
    <audio id="sfx-logo" class="clip" data-start="17.02" data-duration="2" data-track-index="19" data-volume="0.75" src="assets/sfx/impact/impactBell_heavy_000.ogg"></audio>
    <!-- beat-locked: 17.02s -->
  </div>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3/dist/gsap.min.js"></script>
  <script>
    window.__timelines = window.__timelines || {};
    window.__timelines["main"] = gsap.timeline({ paused: true });
  </script>
</body>
</html>
